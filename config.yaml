# A automação só roda contra estes domínios (a autorização do ambiente de testes vale só neles).
# Lista vazia = sem restrição.
allowed_domains:
  - fluxo-automacao.9eivnx.easypanel.host

target:
  login_path: /login

emulator:
  headless: false          # true = emulator -no-window
  boot_timeout: 240        # segundos para esperar o boot completo
  settle_seconds: 20       # folga após o boot, até o sistema parar de carregar
  wipe_data: false

appium:
  host: 127.0.0.1
  port: 4723
  startup_timeout: 60

# Proxy: none | static (lista em proxies.txt) | dynamic (gateway rotativo em PROXY_URL, no .env)
proxy:
  mode: none
  session_template: "{password}_session-{session}"   # parâmetro que pede um IP novo ao provedor
  rotate_on_limit: true      # 'Muitas tentativas' -> troca o IP e continua (em vez de esperar)
  rotate_per_device: true    # cada dispositivo novo usa um IP novo
  price_per_gb: 0            # preço do tráfego, para o custo do lote
  currency: R$

accounts:
  count: 5
  retries: 2
  delay_between: 2         # segundos entre contas
  per_device: 5            # contas por dispositivo; depois o emulador é trocado
  wipe_on_rotate: true     # a troca reinicia o emulador com -wipe-data (dados zerados)
  random_user_agent: false # User-Agent diferente a cada dispositivo
  rate_limit_wait: 180     # espera (s) quando o site responde 'Muitas tentativas'
  rate_limit_max_waits: 8  # esperas seguidas antes de desistir (8 x 180 s = 24 min; o site liberou em ~15 min)
